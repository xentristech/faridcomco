<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-label="El problema de observabilidad: muchas sesiones a la vez">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0a12"/><stop offset="1" stop-color="#15111f"/></linearGradient>
    <linearGradient id="pur3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <radialGradient id="g3" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.25"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1000" height="460" fill="url(#bg3)"/>
  <rect width="1000" height="460" fill="url(#g3)"/>

  <!-- persona / orquestador -->
  <g transform="translate(500,70)">
    <circle cx="0" cy="0" r="30" fill="url(#pur3)"/>
    <text x="0" y="6" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="26" fill="#fff">🧑‍✈️</text>
    <text x="0" y="60" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="14" fill="#e8e6f2" font-weight="700">Tú, el orquestador</text>
  </g>

  <!-- líneas a las terminales -->
  <g stroke="#2a2545" stroke-width="2">
    <path d="M470 90 C 300 130, 180 150, 130 190" fill="none"/>
    <path d="M490 100 C 400 150, 360 170, 340 200" fill="none"/>
    <path d="M510 100 C 600 150, 640 170, 660 200" fill="none"/>
    <path d="M530 90 C 700 130, 820 150, 870 190" fill="none"/>
  </g>

  <!-- 4 terminales, cada una "hablando" texto distinto -->
  <g font-family="Consolas,monospace" font-size="11">
    <g transform="translate(40,200)">
      <rect width="200" height="150" rx="8" fill="#05060a" stroke="#1f2a1f"/>
      <text x="12" y="26" fill="#33d17a">&gt; deploy...</text><text x="12" y="46" fill="#2aa25f">building</text><text x="12" y="66" fill="#33d17a">&gt; edit css</text><text x="12" y="86" fill="#2aa25f">ok</text><text x="12" y="106" fill="#33d17a">&gt; _█</text>
    </g>
    <g transform="translate(255,200)">
      <rect width="200" height="150" rx="8" fill="#05060a" stroke="#1f2a1f"/>
      <text x="12" y="26" fill="#33d17a">&gt; grep err</text><text x="12" y="46" fill="#2aa25f">3 hits</text><text x="12" y="66" fill="#33d17a">&gt; write</text><text x="12" y="86" fill="#2aa25f">saved</text><text x="12" y="106" fill="#33d17a">&gt; _█</text>
    </g>
    <g transform="translate(560,200)">
      <rect width="200" height="150" rx="8" fill="#05060a" stroke="#1f2a1f"/>
      <text x="12" y="26" fill="#33d17a">&gt; test run</text><text x="12" y="46" fill="#2aa25f">passing</text><text x="12" y="66" fill="#33d17a">&gt; npm i</text><text x="12" y="86" fill="#2aa25f">done</text><text x="12" y="106" fill="#33d17a">&gt; _█</text>
    </g>
    <g transform="translate(775,200)">
      <rect width="185" height="150" rx="8" fill="#05060a" stroke="#1f2a1f"/>
      <text x="12" y="26" fill="#33d17a">&gt; api call</text><text x="12" y="46" fill="#2aa25f">200 ok</text><text x="12" y="66" fill="#33d17a">&gt; commit</text><text x="12" y="86" fill="#2aa25f">pushed</text><text x="12" y="106" fill="#33d17a">&gt; _█</text>
    </g>
  </g>

  <text x="500" y="400" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="17" fill="#c9c4de">4 ventanas, 4 relatos en verde. <tspan fill="#f87171" font-weight="700">¿Cuál te está esperando?</tspan></text>
  <text x="500" y="430" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="14" fill="#8d87a8">El trabajo existe y está bien hecho — pero nadie lo está viendo.</text>
</svg>
