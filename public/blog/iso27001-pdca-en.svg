<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PDCA cycle of the ISMS: Plan, Do, Check, Act">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060c"/>
      <stop offset="1" stop-color="#0a0c16"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="7" refY="5" orient="auto">
      <path d="M0,0 L11,5 L0,10 Z" fill="#4f7cff"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="80" y="86" fill="#7f8aa8" font-family="'Segoe UI', system-ui, sans-serif" font-size="26" letter-spacing="6">PDCA CYCLE · THE ENGINE OF THE ISMS</text>

  <g fill="none" stroke="#4f7cff" stroke-width="6" marker-end="url(#arrow)">
    <path d="M916,130 A340,340 0 0 1 1120,334"/>
    <path d="M1120,566 A340,340 0 0 1 916,770"/>
    <path d="M684,770 A340,340 0 0 1 480,566"/>
    <path d="M480,334 A340,340 0 0 1 684,130"/>
  </g>

  <circle cx="800" cy="450" r="104" fill="#0a0c16" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
  <text x="800" y="440" text-anchor="middle" fill="#f3f5fb" font-family="'Segoe UI', system-ui, sans-serif" font-size="46" font-weight="800" letter-spacing="2">ISMS</text>
  <text x="800" y="478" text-anchor="middle" fill="#8b95b5" font-family="'Segoe UI', system-ui, sans-serif" font-size="22">continual improvement</text>

  <g transform="translate(800 150)">
    <rect x="-140" y="-65" width="280" height="130" rx="18" fill="#0a0c16" stroke="#22d3ee" stroke-width="2.5"/>
    <text x="0" y="-8" text-anchor="middle" fill="#22d3ee" font-family="'Segoe UI', system-ui, sans-serif" font-size="38" font-weight="700">Plan</text>
    <text x="0" y="32" text-anchor="middle" fill="#c7cddd" font-family="'Segoe UI', system-ui, sans-serif" font-size="22">Scope, risks and objectives</text>
  </g>

  <g transform="translate(1100 450)">
    <rect x="-140" y="-65" width="280" height="130" rx="18" fill="#0a0c16" stroke="#4f7cff" stroke-width="2.5"/>
    <text x="0" y="-8" text-anchor="middle" fill="#4f7cff" font-family="'Segoe UI', system-ui, sans-serif" font-size="38" font-weight="700">Do</text>
    <text x="0" y="32" text-anchor="middle" fill="#c7cddd" font-family="'Segoe UI', system-ui, sans-serif" font-size="22">Implement the controls</text>
  </g>

  <g transform="translate(800 750)">
    <rect x="-140" y="-65" width="280" height="130" rx="18" fill="#0a0c16" stroke="#34d399" stroke-width="2.5"/>
    <text x="0" y="-8" text-anchor="middle" fill="#34d399" font-family="'Segoe UI', system-ui, sans-serif" font-size="38" font-weight="700">Check</text>
    <text x="0" y="32" text-anchor="middle" fill="#c7cddd" font-family="'Segoe UI', system-ui, sans-serif" font-size="22">Measure, audit and review</text>
  </g>

  <g transform="translate(500 450)">
    <rect x="-140" y="-65" width="280" height="130" rx="18" fill="#0a0c16" stroke="#8b5cf6" stroke-width="2.5"/>
    <text x="0" y="-8" text-anchor="middle" fill="#8b5cf6" font-family="'Segoe UI', system-ui, sans-serif" font-size="38" font-weight="700">Act</text>
    <text x="0" y="32" text-anchor="middle" fill="#c7cddd" font-family="'Segoe UI', system-ui, sans-serif" font-size="22">Correct and improve</text>
  </g>
</svg>
