<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ISO/IEC 27001 — Information security">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060c"/>
      <stop offset="1" stop-color="#0a0c16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.6">
      <stop offset="0" stop-color="#4f7cff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1120"/>
      <stop offset="1" stop-color="#0a0c16"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="0" y1="225" x2="1600" y2="225"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="675" x2="1600" y2="675"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1200" y1="0" x2="1200" y2="900"/>
  </g>

  <g transform="translate(800 250)">
    <path d="M0,-118 L104,-78 L104,26 C104,96 58,140 0,166 C-58,140 -104,96 -104,26 L-104,-78 Z"
          fill="url(#shield)" stroke="url(#accent)" stroke-width="3"/>
    <path d="M-34,-14 a34,34 0 0 1 68,0 v20" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <rect x="-46" y="6" width="92" height="70" rx="12" fill="#0a0c16" stroke="url(#accent)" stroke-width="4"/>
    <circle cx="0" cy="36" r="9" fill="#22d3ee"/>
    <rect x="-4" y="40" width="8" height="22" rx="4" fill="#22d3ee"/>
  </g>

  <text x="800" y="500" text-anchor="middle" fill="#22d3ee" font-family="'Segoe UI', system-ui, sans-serif" font-size="30" letter-spacing="10" font-weight="600">INFORMATION SECURITY</text>

  <text x="800" y="600" text-anchor="middle" fill="#f3f5fb" font-family="'Segoe UI', system-ui, sans-serif" font-size="118" font-weight="800" letter-spacing="2">ISO/IEC 27001</text>

  <text x="800" y="672" text-anchor="middle" fill="#aab2c8" font-family="'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="400">The international standard for protecting data</text>

  <g transform="translate(800 760)">
    <rect x="-160" y="-26" width="320" height="52" rx="26" fill="#0a0c16" stroke="#ffffff" stroke-opacity="0.16"/>
    <circle cx="-126" cy="0" r="6" fill="#22d3ee"/>
    <text x="18" y="7" text-anchor="middle" fill="#c7cddd" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" letter-spacing="2">Xentris Tech · implementing</text>
  </g>
</svg>
